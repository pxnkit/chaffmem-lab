services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - chaffmem
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      CHAFFMEM_ARTIFACT_DIR: /app/artifacts/runs
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - chaffmem-artifacts:/app/artifacts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  chaffmem-artifacts:
